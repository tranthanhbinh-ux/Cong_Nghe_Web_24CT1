{% extends 'store/base.html' %}

{% block title %}Đăng Nhập - BuildGear{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
            <div class="text-center mb-4">
                <i class="fa-solid fa-circle-user fa-4x text-info mb-2"></i>
                <h3 class="fw-bold">Đăng Nhập BuildGear</h3>
                <p class="text-muted small">Đăng nhập để mua linh kiện và theo dõi đơn hàng</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold small">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user text-secondary"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Nhập username" required />
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock text-secondary"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required />
                    </div>
                </div>

                <button type="submit" class="btn btn-info btn-lg text-white fw-bold w-100 py-2 shadow-sm mt-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Đăng Nhập
                </button>
            </form>

            <div class="text-center mt-4 small">
                Chưa có tài khoản? <a href="{% url 'register' %}" class="text-info fw-bold">Đăng ký ngay</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
