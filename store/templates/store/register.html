{% extends 'store/base.html' %}

{% block title %}Đăng Ký Tài Khoản - BuildGear{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus fa-4x text-info mb-2"></i>
                <h3 class="fw-bold">Tạo Tài Khoản Mới</h3>
                <p class="text-muted small">Gia nhập cộng đồng công nghệ BuildGear</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold small">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" name="fullname" class="form-control" placeholder="Ví dụ: Trần Văn Nam" required />
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Tên đăng nhập <span class="text-danger">*</span></label>
                    <input type="text" name="username" class="form-control" placeholder="Tên tài khoản viết liền" required />
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="email@gmail.com" />
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small">Mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Xác nhận lại" required />
                    </div>
                </div>

                <button type="submit" class="btn btn-info btn-lg text-white fw-bold w-100 py-2 shadow-sm mt-2">
                    <i class="fa-solid fa-user-check me-2"></i>Hoàn Tất Đăng Ký
                </button>
            </form>

            <div class="text-center mt-3 small">
                Đã có tài khoản? <a href="{% url 'login' %}" class="text-info fw-bold">Đăng nhập</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
